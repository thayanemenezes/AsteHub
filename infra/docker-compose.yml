services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: astehub_dev
      POSTGRES_USER: astehub_dev
      POSTGRES_PASSWORD: astehub_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astehub_dev -d astehub_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - astehub-postgres-dev:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: astehub_test
      POSTGRES_USER: astehub_test
      POSTGRES_PASSWORD: astehub_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astehub_test -d astehub_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - astehub-postgres-test:/var/lib/postgresql/data

volumes:
  astehub-postgres-dev:
  astehub-postgres-test:
