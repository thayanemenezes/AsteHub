name: CI/CD Monorepo Completo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-build:
    name: Validar e Buildar Projeto
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.changes.outputs.api }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Verifica se houve alterações na pasta da API
      - name: Detectar alterações na API
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'

      - name: Instalar o pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar Lint e Testes
        run: |
          pnpm turbo run lint --cache-dir=".turbo"
          pnpm turbo run test --cache-dir=".turbo"

      - name: Executar Build do App Web (React)
        # Injeta a URL da API do Render como variável de ambiente para o Vite compilar junto com o código
        env:
          NEXT_PUBLIC_API_URL: https://astehub.onrender.com # <-- Substitua pela URL gerada pelo Render para a sua API
        run: pnpm turbo run build --filter=web... --cache-dir=".turbo"


      - name: Deploy Frontend para o GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/web/dist
          branch: gh-pages

  deploy-api:
    name: Deploy da API
    needs: validate-and-build
    # CORREÇÃO: Substituído 'needs:validate-and-build' por 'needs.validate-and-build'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate-and-build.outputs.api_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy no Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}"

